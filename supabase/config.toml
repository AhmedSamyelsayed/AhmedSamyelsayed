# Supabase CLI config for local development and CI (`supabase start`, `supabase test db`).
# Production settings (redirect URLs, Google OAuth, SMTP) are set in the Supabase dashboard.
project_id = "figure"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[storage]
enabled = true
file_size_limit = "20MiB"

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = [
  "http://localhost:5173/**",
  "https://figure.aseautomation.online/**",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true
double_confirm_changes = true

# Google OAuth: set SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID / _SECRET locally
# and flip enabled to true. In production configure it in the dashboard.
[auth.external.google]
enabled = false
client_id = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID)"
secret = "env(SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET)"
skip_nonce_check = false

[functions.send-invite]
verify_jwt = true

[functions.ai]
verify_jwt = true
